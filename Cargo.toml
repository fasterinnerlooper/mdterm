[package]
name = "mdterm"
version = "0.1.0"
edition = "2021"
description = "Markdown terminal viewer with three-stage pipeline: Markdown→HTML→PNG→Terminal art"
authors = ["Shafiq Jetha <shafiq.jetha@outlook.com>"]
license = "MIT"
repository = ""

[dependencies]
# Stage 1: Markdown → HTML
comrak = { version = "0.31", default-features = false }

# Stage 2: HTML → PNG (screenshot)
headless_chrome = "1.0"

# Stage 3: PNG → Terminal (image decoding)
image = "0.25"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# URL encoding for data URIs
urlencoding = "2.1"

# Logging
log = "0.4"
env_logger = "0.11"

# FFI bindings to libchafa
chafa-sys = { path = "chafa-sys" }

# FFI support
libc = "0.2"

tempfile = "3"  # used when delegating exotic formats to the external chafa CLI

[build-dependencies]
bindgen = "0.69"
pkg-config = "0.3"

[features]
default = []
